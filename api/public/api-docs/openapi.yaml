openapi: 3.0.0
info:
  title: Task API
  version: 1.0.0
servers:
  - url: http://localhost/miapp/api/v3
    description: Local development server
  - url: /api/v3
    description: Class server
paths:
  /tareas:
    get:
      summary: Get all tasks
      responses:
        '200':
          description: Task list 
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
    post:
      summary: Create a new task 
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - titulo
                - completada
              properties:
                titulo:
                  type: string
                completada:
                  type: boolean
      responses:
        '201':
          description: Task created successfully 
  /tareas/{id}:
    get:
      summary: Get task by ID 
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Task object 
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
    put:
      summary: Update existing task 
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Task'
      responses:
        '200':
          description: Task updated successfully 
components:
  schemas:
    Task:
      type: object
      properties:
        id:
          type: integer
          example: 1
        titulo:
          type: string
          example: "Estudiar API-First"
        completada:
          type: boolean
          example: false
        fecha_creacion:
          type: string
          format: date-time
          example: "2026-09-07T10:00:00Z"